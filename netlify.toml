# Déploiement Netlify (https://lachemiseafricaine.netlify.app).
# Le site est servi à la racine : pas de BASE_PATH, contrairement à GitHub Pages.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://lachemiseafricaine.netlify.app"
  BASE_PATH = "/"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
